# Dependabot — atualizações de dependências semanais.
#
# O projeto já corre OWASP dependency-check, Trivy e npm audit no CI, mas todos
# eles só REPORTAM: uma dependência com CVE conhecida ficava a falhar o build
# semana após semana até alguém reparar. O Dependabot abre o PR com a correção.
#
# Regras comuns a todos os ecossistemas:
#  - semanal, num dia fixo, para não haver uma avalanche de PRs por dia;
#  - agrupado: um PR por família de dependências (em vez de um PR por pacote);
#  - limitado: no máximo 5 PRs abertos por ecossistema.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # O Next e o React mudam de major com frequência e exigem migração: os PRs
    # de major ficam de fora do agrupamento para serem avaliados um a um.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
