# NorteShopMoz - Continuous Integration Workflow
# Runs on every push and PR to main/develop branches
#
# Required GitHub Secrets (todos opcionais):
# - SONAR_TOKEN (optional, for SonarCloud)
# - SNYK_TOKEN (optional, for Snyk security scanning)
# As imagens Docker são publicadas no GHCR com o GITHUB_TOKEN automático.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Weekly security scan
    - cron: '0 2 * * 1'

env:
  # Docker image names (publicadas no GHCR — não requer secrets extras).
  # O prefixo do registry é OBRIGATÓRIO nos tags; sem ele o buildx envia para docker.io.
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/norteshopmoz-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/norteshopmoz-frontend
  # Registry
  REGISTRY: ghcr.io

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # CODEQL - Static Analysis (SAST)
  # ════════════════════════════════════════════════════════════════════════════
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Build Backend (Java)
        if: matrix.language == 'java'
        run: |
          cd backend
          mvn -B compile -DskipTests

      - name: Build Frontend (JavaScript/TypeScript)
        if: matrix.language == 'javascript'
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ════════════════════════════════════════════════════════════════════════════
  # SECRET SCANNING
  # ════════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for truffleHog

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # A ação já acrescenta --fail automaticamente; repetir dá
          # "flag 'fail' cannot be repeated"
          extra_args: --no-verification

  # ════════════════════════════════════════════════════════════════════════════
  # BACKEND - Spring Boot (Maven)
  # ════════════════════════════════════════════════════════════════════════════
  backend-test:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend

    # Os testes @SpringBootTest usam as portas padrão do application.yaml
    # (Postgres 5434 / Redis 6381), alinhadas com o docker-compose local.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: norteshopmoz
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn -B test

      - name: Build JAR (skip tests, already ran)
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/norteshopmoz-api-*.jar
          retention-days: 7

      - name: Run SpotBugs (static analysis)
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:spotbugs
        continue-on-error: true

  backend-security:
    name: Backend - Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Popula ~/.m2 para o Trivy não ter de resolver BOMs no Maven Central
      # (evita 429 Too Many Requests)
      - name: Resolve Maven dependencies
        run: mvn -B -q dependency:resolve

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'NorteShopMoz API'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --suppressionFile './.github/dependency-check-suppressions.xml'

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/reports/
          retention-days: 30

      # Container image security scan (Trivy)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        id: trivy-backend
        continue-on-error: true
        if: github.event_name == 'push'
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'backend/trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('backend/trivy-results.sarif') != ''
        with:
          sarif_file: 'backend/trivy-results.sarif'

  backend-docker:
    name: Backend - Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # FRONTEND - Next.js
  # ════════════════════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend - Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next/standalone
            frontend/.next/static
            frontend/public
          retention-days: 7

  frontend-security:
    name: Frontend - Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      # Nível de job para que `if:` consiga avaliar o valor (o contexto
      # `secrets` não está disponível em condições de passo).
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Snyk (optional)
        uses: snyk/actions/node@master
        if: env.SNYK_TOKEN != ''
        with:
          args: --severity-threshold=high
          snyk-token: ${{ secrets.SNYK_TOKEN }}

      # Container image security scan (Trivy)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.event_name == 'push'
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'frontend/trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('frontend/trivy-results.sarif') != ''
        with:
          sarif_file: 'frontend/trivy-results.sarif'

  frontend-docker:
    name: Frontend - Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  # ════════════════════════════════════════════════════════════════════════════
  # DOCKER COMPOSE VALIDATION
  # ═══════════════════════════════════════════════════════════════════════════
  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config --quiet
          # O serviço `api` fica atrás do profile "full" no ficheiro base
          docker compose -f docker-compose.yml --profile full config --quiet

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full config --quiet

  # ═══════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, secret-scan, backend-test, backend-security, backend-docker, frontend-test, frontend-security, frontend-docker, docker-compose-validate]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "CodeQL Analysis: ${{ needs.codeql-analysis.result }}"
          echo "Secret Scanning: ${{ needs.secret-scan.result }}"
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Backend Security: ${{ needs.backend-security.result }}"
          echo "Backend Docker: ${{ needs.backend-docker.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Frontend Security: ${{ needs.frontend-security.result }}"
          echo "Frontend Docker: ${{ needs.frontend-docker.result }}"
          echo "Docker Compose: ${{ needs.docker-compose-validate.result }}"

      - name: Fail if any required job failed
        if: |
          needs.codeql-analysis.result != 'success' ||
          needs.secret-scan.result != 'success' ||
          needs.backend-test.result != 'success' ||
          needs.backend-security.result != 'success' ||
          needs.frontend-test.result != 'success' ||
          needs.frontend-security.result != 'success' ||
          needs.docker-compose-validate.result != 'success'
        run: exit 1