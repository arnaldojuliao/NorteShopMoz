# Perfil "unit-test" — base de dados H2 em memória.
#
# Ativado por @ActiveProfiles("unit-test") nos testes. Sem este ficheiro os
# testes corriam contra o PostgreSQL de dev (application.yaml), mutando dados
# reais (ex.: stock de produtos) e falhando de forma cumulativa entre execuções.
# LOCK_MODE=3 (READ_COMMITTED) é necessário para o H2 honrar `SELECT … FOR UPDATE`:
# sem ele o lock pessimista do checkout (contra oversell) não bloqueia, e o
# teste de concorrência passaria com e sem a correção.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_MODE=3
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Os testes correm sobre H2 e criam o schema a partir das entidades
# (create-drop). As migrações Flyway são SQL específico de PostgreSQL, por isso
# ficam desativadas neste perfil.
spring.flyway.enabled=false

# Travões com contadores em Redis: DESLIGADOS neste perfil.
#
# Não é para os testes passarem mais depressa — é para serem DETERMINISTAS. O
# contador global (pedidos/hora, emails públicos/hora) vive no Redis e sobrevive
# entre execuções: ao fim de algumas dezenas de corridas da suite na mesma hora os
# testes de checkout e de registo começavam a receber 429 por causa de execuções
# ANTERIORES. O comportamento dos travões é coberto em testes próprios, sem
# contexto Spring (OrderThrottleServiceTest, EmailThrottleServiceTest),
# precisamente para não depender de estado partilhado.
app.orders.throttle.enabled=false
app.email-throttle.enabled=false
