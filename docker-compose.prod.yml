# NorteShopMoz - Production Docker Compose (VPS único, modo IP/HTTP)
#
# Usage:
#   ./deploy.sh prod
#   # ou manualmente:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Prerequisites:
# 1. .env.prod file with all production secrets
# 2. NEXT_PUBLIC_API_URL deve apontar para este servidor SEM porta 8080
#    (a API é servida pelo nginx em http://SEU_IP/api/...)
# 3. Quando houver domínio: configurar DNS, trocar o mount do conf.d pelo
#    nginx/nginx.conf (HTTPS), publicar 443 e emitir certs com certbot.

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nsm-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-norteshopmoz}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost for security
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-norteshopmoz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nsm-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ─── Backend API (Spring Boot) ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nsm-api-prod
    environment:
      # Database
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-norteshopmoz}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800}

      # CORS - production domain
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-noreply@norteshopmoz.com}
      APP_BASE_URL: ${APP_BASE_URL}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Payments
      PAYMENTS_MODE: ${PAYMENTS_MODE:-simulated}

      # Social Login
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}

      # Cookies (APP_COOKIE_SECURE exige HTTPS; em modo IP/HTTP temporário
      # defina APP_COOKIE_SECURE=false no .env.prod, senão o login quebra)
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}

      # Força IPv4 na JVM: sem rota IPv6 na VPS, o DNS pode devolver apenas
      # registos AAAA e chamadas externas (Resend, Google, Facebook) falham
      # com "Network is unreachable".
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

      # Logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_MZ_NORTESHOPMOZ: INFO

      # Spring profiles
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # Loopback apenas: deploy.sh (health check) e Prometheus (host.docker.internal)
      # Acesso público à API é feito pelo nginx em http://SERVIDOR/api/...
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # O código consome NEXT_PUBLIC_API_BASE_URL (lib/api.ts, lib/orders.ts)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${APP_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${APP_BASE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-${FACEBOOK_APP_ID:-}}
    container_name: nsm-frontend-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_SITE_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-${FACEBOOK_APP_ID:-}}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Nginx (reverse proxy: 80 → frontend + /api/ → backend) ────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nsm-nginx-prod
    ports:
      - "80:80"
      - "443:443"  # reservado para a migração HTTPS (nginx.conf + certbot)
    volumes:
      - ./nginx/conf.d/norteshopmoz.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: nsm-prod-network
    driver: bridge
    driver_opts:
      # MTU reduzido: nesta rede o path MTU real é <1300 e o ICMP de
      # fragmentação está filtrado — com o padrão 1500, o handshake TLS dos
      # containers morre ("Unable to establish SSL") enquanto o host funciona.
      # Mesma correção já aplicada no docker-compose.yml de dev.
      com.docker.network.driver.mtu: "1200"