# NorteShopMoz - Nginx Reverse Proxy (modo IP/HTTP, sem domínio ainda)
# Montado como /etc/nginx/conf.d/default.conf pelo docker-compose.prod.yml.
#
# ATENÇÃO: não montar este ficheiro em conjunto com o nginx/nginx.conf (HTTPS),
# os dois definem servers na porta 80. Quando houver domínio + certbot,
# passe a usar apenas o nginx.conf (SSL termination em 443).

# Rate limiting zones (mesmas zonas do nginx.conf HTTPS)
# 30r/s (e não 10r/s) no balde de autenticação: em Moçambique milhares de
# clientes partilham o mesmo IP público (CGNAT) e o nginx limita por IP — a
# 10r/s, um pico de logins legítimos atrás de um único IP devolvia 503 a todos.
limit_req_zone $binary_remote_addr zone=nsm_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=nsm_auth:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nsm_upload:10m rate=5r/s;

# Upstreams (nomes distintos dos do nginx.conf para evitar colisão)
upstream nsm_backend {
    server api:8080;
    keepalive 32;
}

upstream nsm_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # catch-all para qualquer IP/host

    # 429 (Too Many Requests) e não o 503 por omissão: um limite de tráfego não é
    # uma avaria do servidor — o 503 fazia o frontend marcar a API como
    # indisponível e cair para os dados locais.
    limit_req_status 429;

    # Upload de imagens de produto: o limite por omissão do nginx é 1 MB e
    # rejeitava com 413 qualquer foto acima disso, apesar de o backend aceitar
    # até 10 MB (spring.servlet.multipart.max-file-size). Tem de ser >= a esse
    # valor (12m = 10 MB de ficheiro + overhead do formulário).
    client_max_body_size 12m;

    # Sonda interna do contentor (healthcheck do compose).
    location = /healthz {
        access_log off;
        return 200;
    }

    # Cabeçalhos de segurança (definidos num só sítio — ver o snippet).
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/x-javascript;

    # ─── API (o backend Spring Boot serve tudo sob /api/**) ──────────────────
    # Mesmo desenho do nginx.conf HTTPS: frontend chama $ORIGIN/api/...
    location /api/ {
        limit_req zone=nsm_api burst=100 nodelay;

        # Rate limit mais estrito para auth
        location ~* ^/api/(auth|login|register|password) {
            limit_req zone=nsm_auth burst=20 nodelay;
        }

        proxy_pass http://nsm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (e não $proxy_add_x_forwarded_for): o nginx é a fronteira,
        # pelo que não deve confiar nem repassar um X-Forwarded-For do cliente —
        # caso contrário o rate limit/lockout do backend podia ser contornado.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Upload de imagens de produto (POST /api/upload) — limite estrito.
    # Location exata: tem prioridade sobre prefixos e regex. A regra anterior
    # (`~* ^/api/(products|upload).*\.(jpg|…)$`) nunca correspondia, porque o
    # upload não tem extensão no URL.
    location = /api/upload {
        limit_req zone=nsm_upload burst=10 nodelay;
        proxy_pass http://nsm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Imagens guardadas localmente pelo backend (fallback sem Cloudinary).
    # O `^~` impede que a location de regex de extensões (.jpg/.png/…) capture
    # estes pedidos e os envie para o frontend (resultava em 404).
    location ^~ /uploads/ {
        proxy_pass http://nsm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # Actuator health apenas para redes privadas (monitorização/prometheus)
    location /actuator/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://nsm_backend;
    }

    # ─── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
        limit_req zone=nsm_api burst=200 nodelay;
        proxy_pass http://nsm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets com cache imutável.
    # Nestas locations o `add_header` do Cache-Control substitui os herdados do
    # `server`, por isso o snippet dos cabeçalhos de segurança tem de ser incluído
    # outra vez (senão os assets ficavam sem `nosniff`).
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Favicon e assets públicos
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=86400";
    }

    # Robots.txt e sitemap
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=86400";
    }
}
