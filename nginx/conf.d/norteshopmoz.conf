# NorteShopMoz - Nginx Reverse Proxy (modo IP/HTTP, sem domínio ainda)
# Montado como /etc/nginx/conf.d/default.conf pelo docker-compose.prod.yml.
#
# ATENÇÃO: não montar este ficheiro em conjunto com o nginx/nginx.conf (HTTPS),
# os dois definem servers na porta 80. Quando houver domínio + certbot,
# passe a usar apenas o nginx.conf (SSL termination em 443).

# Rate limiting zones (mesmas zonas do nginx.conf HTTPS)
limit_req_zone $binary_remote_addr zone=nsm_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=nsm_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=nsm_upload:10m rate=5r/s;

# Upstreams (nomes distintos dos do nginx.conf para evitar colisão)
upstream nsm_backend {
    server api:8080;
    keepalive 32;
}

upstream nsm_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # catch-all para qualquer IP/host

    # Headers de segurança base
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/x-javascript;

    # ─── API (o backend Spring Boot serve tudo sob /api/**) ──────────────────
    # Mesmo desenho do nginx.conf HTTPS: frontend chama $ORIGIN/api/...
    location /api/ {
        limit_req zone=nsm_api burst=100 nodelay;

        # Rate limit mais estrito para auth
        location ~* ^/api/(auth|login|register|password) {
            limit_req zone=nsm_auth burst=20 nodelay;
        }

        # Rate limit mais estrito para uploads
        location ~* ^/api/(products|upload).*\.(jpg|jpeg|png|webp|gif)$ {
            limit_req zone=nsm_upload burst=10 nodelay;
        }

        proxy_pass http://nsm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Actuator health apenas para redes privadas (monitorização/prometheus)
    location /actuator/health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://nsm_backend;
    }

    # ─── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
        limit_req zone=nsm_api burst=200 nodelay;
        proxy_pass http://nsm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets com cache imutável
    location /_next/static/ {
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Favicon e assets públicos
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff|woff2)$ {
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=86400";
    }

    # Robots.txt e sitemap
    location = /robots.txt {
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        proxy_pass http://nsm_frontend;
        add_header Cache-Control "public, max-age=86400";
    }
}
