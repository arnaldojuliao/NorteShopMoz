# NorteShopMoz — cabeçalhos de segurança comuns ao nginx
#
# PORQUE É UM FICHEIRO À PARTE: no nginx, uma `location` que declara **qualquer**
# `add_header` deixa de herdar TODOS os `add_header` do `server`. Era o caso das
# locations de estáticos (`/_next/static/`, `/static/`, a de extensões, o
# robots.txt e o sitemap), que só querem `Cache-Control` — e ficavam sem
# `X-Content-Type-Options: nosniff` e sem os restantes. Com o snippet, cada
# location volta a incluí-lo explicitamente (e um novo `add_header` numa location
# nova passa a ter uma linha óbvia a acrescentar).
#
# Incluir assim, tanto no `server` como em cada `location` que use `add_header`:
#
#     include /etc/nginx/snippets/security-headers.conf;
#
# NÃO incluir o CSP nem o HSTS aqui:
#   · o CSP é definido num só sítio (o middleware do Next — ver frontend/src/proxy.ts),
#     porque dois cabeçalhos CSP fazem o browser aplicar a INTERSEÇÃO das duas
#     políticas: qualquer diretiva em falta num deles (ex.: a origem da API em
#     `connect-src`) passa a bloquear recursos que o outro permitia;
#   · o HSTS só faz sentido sobre TLS e é declarado apenas no `server` da porta
#     443 (um header HSTS recebido por HTTP é ignorado pelo browser).

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
