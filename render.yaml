# NorteShopMoz — Blueprint do Render (API Spring Boot).
#
# O Render lê este ficheiro na raiz do repositório quando crias o serviço:
#   Dashboard → New + → Blueprint → escolhe o repositório.
#
# As variáveis com `sync: false` são pedidas no formulário antes do primeiro
# deploy — preenche-as com os valores do Supabase/Upstash/PaySuite.
#
# Planos:
#   free    — grátis, mas adormece após ~15 min sem tráfego (arranque lento)
#             e tem 512 MB de RAM.
#   starter — ~$7/mês, sempre ativa (recomendado em produção).
services:
  - type: web
    name: norteshop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: fra1 # Frankfurt — a região Render mais próxima de Moçambique
    plan: free # muda para "starter" quando a loja estiver em produção
    healthCheckPath: /actuator/health
    autoDeploy: true # deploy automático em push para main
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      # A middleware da Vercel envia X-Proxy-Token; sem ele o header é ignorado.
      - key: CLIENT_IP_HEADER
        value: X-Real-IP
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: REDIS_TIMEOUT
        value: "2s"

      # ── Obrigatórias (preencher no formulário do Blueprint) ──
      # Cola a URI postgresql:// do Session Pooler do Supabase tal como está
      # (a API converte para jdbc:postgresql:// automaticamente).
      - key: DB_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      # Gerar: openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      # Igual a API_PROXY_SECRET na Vercel. Gerar: openssl rand -hex 32
      - key: PROXY_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Gerar: openssl rand -base64 24
      - key: ADMIN_PASSWORD
        sync: false
      # URL da loja (ex.: https://norteshop.vercel.app) — emails e links.
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # "live" exige PAYMENTS_API_KEY (a API não arranca sem ela). Para o
      # primeiro deploy de teste podes definir "simulated" aqui ou no dashboard.
      - key: PAYMENTS_MODE
        value: live
      - key: PAYMENTS_API_KEY
        sync: false
      - key: PAYMENTS_WEBHOOK_SECRET
        sync: false
      # URLs que os clientes/gateway usam (mesmo valor em ambiente de teste).
      - key: PAYMENTS_WEBHOOK_URL
        sync: false
      - key: PAYMENTS_RETURN_URL
        sync: false
      - key: RESEND_FROM
        sync: false

      # ── Opcionais (descomentar quando precisares) ──
      # - key: DB_USER          # alternativa à URI: credenciais separadas
      # - key: DB_PASSWORD
      # - key: REDIS_PORT
      #   value: "6379"
      # - key: TRUSTED_PROXIES  # só se precisares de cair para X-Forwarded-For
      # - key: FLYWAY_URL       # ligação DDL separada (Session Pooler por omissão)
      # - key: CACHE_REDIS_HOST # SEGUNDA base Upstash só para cache
      # - key: CACHE_REDIS_PASSWORD
      # - key: RESEND_API_KEY
      # - key: CLOUDINARY_CLOUD_NAME
      # - key: CLOUDINARY_API_KEY
      # - key: CLOUDINARY_API_SECRET
      # - key: GOOGLE_CLIENT_ID
      # - key: FACEBOOK_APP_ID
      # - key: FACEBOOK_APP_SECRET
      # - key: AUDIT_WEBHOOK_URL
