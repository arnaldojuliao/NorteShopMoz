# TruffleHog configuration
# See https://github.com/trufflesecurity/trufflehog#configuration

# Exclude paths that commonly contain false positives or test fixtures
exclude_paths:
  - ".env"
  - ".env.*"
  - "*.example"
  - "*.example.*"
  - "frontend/.env.local"
  - "backend/target/"
  - "frontend/node_modules/"
  - "frontend/.next/"
  - "*.log"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.ico"
  - "*.svg"
  - "*.woff"
  - "*.woff2"
  - "*.ttf"
  - "*.eot"
  - "*.map"

# Only fail on verified secrets (reduces false positives)
verified_only: true

# Maximum file size to scan (in bytes)
max_file_size: 1048576  # 1MB